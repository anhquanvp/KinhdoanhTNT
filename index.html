<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Báo Cáo Doanh Thu — Vùng TNT | GHN</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --blue:#2563EB;--blue-dark:#1D4ED8;--blue-light:#EFF6FF;--blue-mid:#BFDBFE;
  --ink:#0F172A;--text-main:#1E293B;--text-sub:#64748B;--text-muted:#94A3B8;
  --border:#E2E8F0;--border-light:#F1F5F9;--bg:#F1F5F9;--card:#FFFFFF;
  --shadow-sm:0 1px 3px rgba(15,23,42,0.06);
  --shadow-md:0 8px 30px rgba(15,23,42,0.08);--radius:14px;
  --green:#059669;--yellow:#D97706;--red:#DC2626;
  --green-bg:#ECFDF5;--yellow-bg:#FFFBEB;--red-bg:#FEF2F2;
  --sidebar-w:240px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text-main);display:flex;min-height:100vh;font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
.sidebar{width:var(--sidebar-w);background:#0F172A;display:flex;flex-direction:column;position:fixed;top:0;left:0;height:100vh;z-index:100;overflow-y:auto;border-right:1px solid rgba(255,255,255,.06)}
.logo-area{padding:22px 18px 18px;border-bottom:1px solid rgba(255,255,255,0.08)}
.logo-title{color:#fff;font-size:15px;font-weight:800;letter-spacing:-.2px}
.logo-sub{color:rgba(255,255,255,.5);font-size:10px;font-weight:600;letter-spacing:.6px;margin-top:8px;text-transform:uppercase}
.logo-author{color:rgba(255,255,255,.28);font-size:10px;margin-top:6px}
.nav-section{padding:16px 18px 8px;color:rgba(255,255,255,.28);font-size:9px;font-weight:700;letter-spacing:1px;text-transform:uppercase}
.nav-item{display:flex;align-items:center;gap:10px;padding:11px 14px;margin:2px 10px;border-radius:10px;cursor:pointer;color:rgba(255,255,255,.58);font-size:13px;font-weight:500;transition:all .15s;border:none;background:none;width:calc(100% - 20px);text-align:left}
.nav-item:hover{background:rgba(255,255,255,.07);color:#fff}
.nav-item.active{background:var(--blue);color:#fff;font-weight:600;box-shadow:0 4px 14px rgba(37,99,235,.35)}
.nav-item .icon{font-size:14px;width:18px;text-align:center;flex-shrink:0;opacity:.85}
.refresh-btn{display:flex;align-items:center;justify-content:center;gap:7px;margin:16px 12px 6px;padding:10px 14px;border-radius:10px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);color:rgba(255,255,255,.75);font-size:12px;font-weight:600;cursor:pointer;width:calc(100% - 24px);transition:background .15s}
.refresh-btn:hover{background:rgba(255,255,255,.1);color:#fff}
.export-btn{display:flex;align-items:center;justify-content:center;gap:7px;margin:6px 12px 4px;padding:10px 14px;border-radius:10px;background:rgba(16,185,129,.12);border:1px solid rgba(16,185,129,.28);color:#6EE7B7;font-size:12px;font-weight:600;cursor:pointer;width:calc(100% - 24px);transition:background .15s}
.export-btn:hover{background:rgba(16,185,129,.22);color:#fff}
.export-btn:disabled{opacity:.45;cursor:not-allowed}
.refresh-btn.spinning .spin{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.last-update{color:rgba(255,255,255,.28);font-size:10px;text-align:center;padding:8px 12px 18px}
.main{margin-left:var(--sidebar-w);flex:1;padding:28px 32px 72px;max-width:1480px}
.page-header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:24px;flex-wrap:wrap;gap:12px;padding-bottom:20px;border-bottom:1px solid var(--border)}
.page-title{font-size:22px;font-weight:800;letter-spacing:-.4px;color:var(--ink)}
.page-sub{color:var(--text-sub);font-size:13px;margin-top:5px;font-weight:400}
.badge{display:inline-flex;align-items:center;gap:5px;background:var(--blue-light);color:var(--blue-dark);font-size:11px;font-weight:600;padding:5px 12px;border-radius:99px;border:1px solid var(--blue-mid)}
.data-banner{background:#FFFBEB;border:1px solid #FDE68A;color:#92400E;font-size:13px;font-weight:500;padding:12px 16px;border-radius:var(--radius);margin-bottom:20px;line-height:1.55}
.data-banner.err{background:var(--red-bg);border-color:#FECACA;color:#991B1B}
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;margin-bottom:24px}
.kpi-card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow-sm);padding:20px 22px;border:1px solid var(--border);position:relative;overflow:hidden}
.kpi-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--blue),var(--blue-dark));opacity:.85}
.kpi-card:nth-child(2)::before{background:linear-gradient(90deg,#059669,#10B981)}
.kpi-card:nth-child(3)::before{background:linear-gradient(90deg,#D97706,#F59E0B)}
.kpi-card:nth-child(4)::before{background:linear-gradient(90deg,#6366F1,#818CF8)}
.kpi-card .ic{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:17px;margin-bottom:14px}
.kpi-card .lbl{color:var(--text-sub);font-size:12px;font-weight:600;margin-bottom:8px;line-height:1.4}
.kpi-card .val{margin-bottom:4px}
.kpi-card .hero-amt{font-size:28px;font-weight:800;letter-spacing:-.5px;color:var(--ink);font-variant-numeric:tabular-nums}
.kpi-card .hero-unit{font-size:13px;font-weight:600;color:var(--text-muted);margin-left:4px}
.kpi-card .hero-sub{font-size:15px;font-weight:600;color:var(--text-sub)}
.kpi-card .sub{font-size:12px;color:var(--text-muted);margin-top:10px;line-height:1.45}
.kpi-card .progress{margin-top:14px;height:6px;background:var(--border-light);border-radius:99px;overflow:hidden}
.kpi-card .progress-fill{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--blue),var(--blue-dark));transition:width .4s ease}
.kpi-card .progress-lbl{display:flex;justify-content:space-between;font-size:11px;color:var(--text-muted);margin-top:6px;font-weight:500}
.kpi-card .cmp{margin-top:12px;padding-top:12px;border-top:1px solid var(--border-light);font-size:12px;line-height:1.65;color:var(--text-sub)}
.kpi-card .cmp b{font-weight:700;color:var(--text-main);font-variant-numeric:tabular-nums}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow-sm);border:1px solid var(--border);margin-bottom:24px;overflow:hidden}
.card-header{padding:16px 22px;border-bottom:1px solid var(--border-light);display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;background:linear-gradient(180deg,#FAFBFC 0%,#FFF 100%)}
.card-title{display:flex;align-items:center;gap:10px;font-weight:700;font-size:14px;color:var(--ink);letter-spacing:-.2px}
.card-icon{width:28px;height:28px;border-radius:8px;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0}
.table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.tbl-pro{width:100%;border-collapse:separate;border-spacing:0;font-size:13px}
table.tbl-pro th{padding:11px 16px;text-align:left;font-weight:600;font-size:11px;color:var(--text-sub);text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid var(--border);white-space:nowrap;background:#F8FAFC;position:sticky;top:0;z-index:2}
table.tbl-pro th.num{text-align:right}
table.tbl-pro th.grp-hdr{text-align:center;background:#EFF6FF;color:var(--blue-dark);font-size:10px;letter-spacing:.6px;border-bottom:1px solid var(--blue-mid)}
table.tbl-pro td{padding:12px 16px;border-bottom:1px solid var(--border-light);vertical-align:middle}
table.tbl-pro tbody tr:hover td{background:#F8FAFC}
table.tbl-pro tbody tr:nth-child(even):not(.tot):not(.row-grp-tot) td{background:#FAFBFC}
table.tbl-pro tbody tr:hover:nth-child(even):not(.tot) td{background:#F1F5F9}
table.tbl-pro .col-sticky{position:sticky;left:0;background:inherit;z-index:1;box-shadow:2px 0 4px rgba(15,23,42,.04)}
table.tbl-pro .col-sticky-2{position:sticky;left:120px;background:inherit;z-index:1}
table{width:100%;border-collapse:collapse;font-size:13px}
th{padding:11px 16px;text-align:left;font-weight:600;font-size:11px;color:var(--text-sub);text-transform:uppercase;letter-spacing:.4px;border-bottom:1px solid var(--border);white-space:nowrap;background:#F8FAFC}
td{padding:12px 16px;border-bottom:1px solid var(--border-light);vertical-align:middle}
tr:last-child td{border-bottom:none}
tr.row-warn td{background:var(--yellow-bg)!important}
tr.row-danger td{background:var(--red-bg)!important;color:#991B1B;font-weight:600}
tr.row-danger td:first-child{border-left:3px solid var(--red)}
tr.tot td{background:var(--blue-light)!important;font-weight:700;color:var(--blue-dark);border-top:2px solid var(--blue-mid)}
tr.row-grp-tot td{background:#F1F5F9!important;font-weight:600}
.am-block{margin-bottom:20px}
.am-block .am-title{font-size:12px;font-weight:700;padding:10px 22px;background:#F8FAFC;border-bottom:1px solid var(--border-light);color:var(--text-sub);text-transform:uppercase;letter-spacing:.4px}
.alert-tag{display:inline-block;padding:3px 10px;border-radius:99px;font-size:11px;font-weight:600;background:var(--red-bg);color:var(--red)}
.alert-tag.warn{background:var(--yellow-bg);color:var(--yellow)}
.unit-note{font-size:11px;color:var(--text-muted);font-weight:500}
.num{text-align:right;font-variant-numeric:tabular-nums}
.v-num{font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
.v-unit{font-size:10px;font-weight:600;color:var(--text-muted);margin-left:3px;letter-spacing:.2px}
.empty-val{color:var(--text-muted);font-weight:400}
.lbl-name{font-weight:600;color:var(--ink);white-space:nowrap}
.lbl-sub{font-size:11px;color:var(--text-muted);font-weight:500}
.nhom-tag{display:inline-block;padding:2px 8px;border-radius:6px;font-size:11px;font-weight:700;background:#F1F5F9;color:var(--text-sub)}
.nhom-tag.g-a{background:#EFF6FF;color:#1D4ED8}
.nhom-tag.g-bcd{background:#F0FDF4;color:#047857}
.nhom-tag.g-ef{background:#FFFBEB;color:#B45309}
.nhom-tag.g-g{background:#F5F3FF;color:#6D28D9}
.up{color:var(--red);font-weight:600;font-size:12px}
.down{color:var(--green);font-weight:600;font-size:12px}
.flat{color:var(--text-muted);font-size:12px;font-weight:500}
.trend-tag{display:inline-flex;align-items:center;gap:3px;padding:3px 8px;border-radius:6px;font-size:11px;font-weight:600;white-space:nowrap}
.trend-tag.up{background:var(--red-bg);color:var(--red)}
.trend-tag.down{background:var(--green-bg);color:var(--green)}
.trend-tag.flat{background:#F1F5F9;color:var(--text-muted)}
.pct-pill{display:inline-block;padding:4px 10px;border-radius:99px;font-size:11px;font-weight:700;font-variant-numeric:tabular-nums;min-width:52px;text-align:center}
.pct-g{background:var(--green-bg);color:var(--green)}
.pct-y{background:var(--yellow-bg);color:var(--yellow)}
.pct-r{background:var(--red-bg);color:var(--red)}
.pct-wrap{display:inline-flex;align-items:center;gap:8px;justify-content:flex-end;width:100%}
.pct-bar{flex:1;max-width:64px;height:5px;background:var(--border-light);border-radius:99px;overflow:hidden}
.pct-fill{height:100%;border-radius:99px;transition:width .3s}
.pct-fill.pct-g{background:var(--green)}
.pct-fill.pct-y{background:var(--yellow)}
.pct-fill.pct-r{background:var(--red)}
.analysis-box{margin:0 22px 20px;padding:14px 18px;background:var(--blue-light);border-radius:10px;font-size:13px;line-height:1.7;color:var(--text-main);border:1px solid var(--blue-mid)}
.analysis-box b{color:var(--blue-dark);font-weight:700}
.section-note{padding:18px 22px;color:var(--text-sub);font-size:13px;line-height:1.55}
.overview-split{display:grid;grid-template-columns:1fr 1fr;gap:0;border-top:1px solid var(--border-light)}
.overview-half{padding:0 0 16px;border-right:1px solid var(--border-light)}
.overview-half:last-child{border-right:none}
.overview-half-hd{padding:12px 18px;font-size:12px;font-weight:700;border-bottom:1px solid var(--border-light);background:#FAFBFC}
.overview-half-hd.good{color:var(--green)}
.overview-half-hd.bad{color:var(--red)}
table.tbl-pro.compact td,table.tbl-pro.compact th{padding:8px 12px;font-size:12px}
.cust-list{line-height:1.8}
.cust-chip{display:inline-block;font-size:11px;padding:2px 8px;margin:2px 4px 2px 0;border-radius:6px;background:var(--border-light);color:var(--text-main);font-weight:500}
.cust-chip.warn{background:var(--yellow-bg);color:#92400E;border:1px solid #FDE68A}
@media(max-width:900px){.overview-split{grid-template-columns:1fr}.overview-half{border-right:none;border-bottom:1px solid var(--border-light)}}
.tabbar{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:16px;flex-wrap:wrap}
.tabbtn{padding:9px 14px;border:none;background:none;font-size:12.5px;font-weight:700;color:var(--text-sub);cursor:pointer;border-bottom:2.5px solid transparent}
.tabbtn.active{color:var(--blue);border-bottom-color:var(--blue)}
.loading{padding:48px;text-align:center;color:var(--text-sub)}
.spin-ic{display:inline-block;animation:spin 1s linear infinite}
.foot-note{font-size:11px;color:var(--text-muted);padding:12px 22px 18px;line-height:1.5}
.chart-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(360px,1fr));gap:20px;margin-bottom:24px}
.chart-box{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-sm);padding:20px 22px}
.chart-box .chart-title{font-size:14px;font-weight:700;margin-bottom:4px;color:var(--ink);letter-spacing:-.2px}
.chart-box .chart-sub{font-size:11px;color:var(--text-muted);margin-bottom:16px}
.chart-wrap{position:relative;height:300px}
.rank-num{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:7px;background:#F1F5F9;color:var(--text-sub);font-size:11px;font-weight:700}
.rank-num.top3{background:var(--blue-light);color:var(--blue-dark)}
@media(max-width:900px){.sidebar{display:none}.main{margin-left:0;padding:20px 16px 48px}}
</style>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0/dist/chartjs-plugin-datalabels.min.js"></script>
</head>
<body>

<div class="sidebar">
  <div class="logo-area">
    <div class="logo-title">📦 GHN — Vùng TNT</div>
    <div class="logo-sub">Báo cáo Doanh Thu</div>
    <div class="logo-author">AM Vùng: Phan Văn Quân</div>
  </div>
  <div class="nav-section">Báo cáo</div>
  <button class="nav-item active" data-page="overview" onclick="showPage('overview')"><span class="icon">📌</span> Tổng Quan</button>
  <button class="nav-item" data-page="decline" onclick="showPage('decline')"><span class="icon">⚠️</span> AM Giảm Doanh Thu</button>
  <button class="nav-item" data-page="segment" onclick="showPage('segment')"><span class="icon">👥</span> Phân Nhóm Khách Hàng</button>
  <button class="nav-item" data-page="nhomKH" onclick="showPage('nhomKH')"><span class="icon">👥</span> DT Theo Nhóm KH</button>
  <button class="nav-item" data-page="dtTinh" onclick="showPage('dtTinh')"><span class="icon">🗺️</span> DT Theo Tỉnh</button>
  <button class="nav-item" data-page="nhomA" onclick="showPage('nhomA')"><span class="icon">⭐</span> Nhóm A</button>
  <button class="refresh-btn" id="refreshBtn" onclick="refreshAll()"><span class="spin">🔄</span> Cập nhật dữ liệu</button>
  <button class="export-btn" id="exportDocBtn" onclick="exportWeeklyReportDoc()" disabled>📄 Xuất báo cáo tuần (.doc)</button>
  <div class="last-update" id="lastUpdate">Chưa tải dữ liệu</div>
</div>

<div class="main">
  <div id="overview" class="page"></div>
  <div id="decline" class="page" style="display:none"></div>
  <div id="segment" class="page" style="display:none"></div>
  <div id="nhomKH" class="page" style="display:none"></div>
  <div id="dtTinh" class="page" style="display:none"></div>
  <div id="nhomA" class="page" style="display:none"></div>
</div>

<script>
/* ===================== CONFIG ===================== */
const SID = '15vJ5y5hkS8VvZtBpZkltzP-yzx-QrVh5FK9OgMzeO4Y';
const GID = {
  ketQua: '0',              // Kết Quả — DoanhThu MTD theo AM (Thang hiện tại)
  kpiAM: '2068174456',      // KPI AM — Tháng, AM, KPI Vùng, KPI CM
  dtThang: '2046881648',    // DT-Tháng — doanh thu 2026 theo tháng
  dtNgay: '2072520508',     // DT-Ngày — DoanhThu theo AM theo Ngày
  phanNhom: '682625869',    // PHÂN NHÓM KHÁCH HÀNG — theo Nhom/Ngay/Tuần
  khNhomA: '1648814630'     // khách hàng nhóm A — chi tiết khách hàng
};
const SHEET = {
  dtThang2025: 'DT-Tháng2025',  // Doanh thu 2025 — fetch theo tên sheet
  dtThang2026: 'DT-Tháng',       // Doanh thu 2026 — sheet bổ sung (vd. 2026/6 + 2026/06)
  doanhThuGTC: 'DoanhThu-GTC',    // Doanh thu GTC — cấu trúc giống DT-Tháng
  totalKH: 'TotalKH'               // Chi tiết KH theo nhóm — tính tiềm năng lên A
};
const NHOM_A_DT_NGUONG = 45e6;   // Ngưỡng nhóm A: 45 triệu đồng / tháng
const VUNG_NAME = 'Vùng TNT';
const NHOM_GIU_CU = ['A','BCD','EF'];
window._charts = {};
if(typeof ChartDataLabels!=='undefined') Chart.register(ChartDataLabels);

/* ===================== HELPERS ===================== */
function fmt(n){ if(n==null||isNaN(n))return '—'; return Math.round(n).toLocaleString('vi-VN'); }
function fmtM(n){
  if(n==null||isNaN(n)) return '—';
  const v=n/1e6;
  if(Math.abs(v)>=100) return v.toLocaleString('vi-VN',{maximumFractionDigits:0});
  if(Math.abs(v)>=10) return v.toLocaleString('vi-VN',{minimumFractionDigits:1,maximumFractionDigits:1});
  return v.toLocaleString('vi-VN',{minimumFractionDigits:2,maximumFractionDigits:2});
}
function fmtVnd(n){ return fmtM(n)+' tr'; }
function fmtVndCell(n){
  if(n==null||isNaN(n)||!n) return '<span class="empty-val">—</span>';
  return `<span class="v-num">${fmtM(n)}</span><span class="v-unit">tr</span>`;
}
function fmtVolCell(n){
  if(n==null||isNaN(n)||!n) return '<span class="empty-val">—</span>';
  return `<span class="v-num">${fmt(n)}</span><span class="v-unit">đơn</span>`;
}
function fmtVndHero(n){
  if(n==null||isNaN(n)||!n) return '<span class="empty-val">—</span>';
  const v=n/1e6;
  const amt=v>=100?v.toLocaleString('vi-VN',{maximumFractionDigits:0}):v.toLocaleString('vi-VN',{minimumFractionDigits:1,maximumFractionDigits:1});
  return `<span class="hero-amt">${amt}</span><span class="hero-unit">tr</span>`;
}
function pctCell(p){
  const cls=p>=100?'pct-g':p>=70?'pct-y':'pct-r';
  const w=Math.min(100,Math.max(0,p));
  return `<div class="pct-wrap"><div class="pct-bar"><div class="pct-fill ${cls}" style="width:${w}%"></div></div><span class="pct-pill ${cls}">${p.toFixed(0)}%</span></div>`;
}
function nhomTag(g){
  const cls={A:'g-a',BCD:'g-bcd',EF:'g-ef',G:'g-g'}[g]||'';
  return `<span class="nhom-tag ${cls}">${g}</span>`;
}
function pct(n,d){ if(!d) return 0; return n/d*100; }
function idxOfLast(header,name){
  let idx=-1;
  header.forEach((h,i)=>{ if((h||'').trim()===name) idx=i; });
  return idx;
}
function idxOfNth(header,name,n){
  let c=0;
  for(let i=0;i<header.length;i++){
    if((header[i]||'').trim()===name){ c++; if(c===n) return i; }
  }
  return -1;
}
function idxAMCol(header){
  let c=0, amIdx=-1;
  header.forEach((h,i)=>{
    if((h||'').trim()==='Kho Chuẩn'){ c++; if(c===2) amIdx=i; }
  });
  return amIdx;
}
function idxTotalKHAmChuan(header){
  const i=idxOf(header,'AM Chuẩn');
  return i>=0?i:(header.length>15?15:-1);
}
function normNhom(n){
  n=(n||'').trim().toUpperCase();
  if(!n) return null;
  if(n==='A'||/^A\d+$/.test(n)) return 'A';
  if(n==='BCD'||n==='B'||n==='C'||n==='D') return 'BCD';

function isoWeekFromIsoDate(iso){
  const d=new Date(iso+'T12:00:00');

  d.setUTCDate(d.getUTCDate()+4-dayNum);

function isoShiftDays(iso, delta){
  const d=new Date(iso+'T12:00:00');

  const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), day=String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function mondayOfIsoWeek(iso){
  if(!/^\d{4}-\d{2}-\d{2}$/.test(iso||'')) return '';
  const d=new Date(iso+'T12:00:00');
  const day=d.getDay()||7;
  d.setDate(d.getDate()-(day-1));
  const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), dayN=String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${dayN}`;
}
function isoEachDay(from, to){
  if(!from||!to||from>to) return [];
  const out=[];
  for(let d=from;d<=to;d=isoShiftDays(d,1)) out.push(d);
  return out;
}

function idxNgayChuanHoa(header){

function parseKhNhomAWeekly(khNhomA, thang){
  if(!khNhomA||khNhomA.length<2) return null;
  const h=khNhomA[0];
  const iMa=idxOf(h,'MaKH'), iTen=idxOf(h,'TenKH'), iNgay=idxOf(h,'Ngay');
  const iAMk=idxAMCol(h)>=0?idxAMCol(h):22;
  let iDT=idxOfNth(h,'% Doanh thu đạt được so với MTD',3);
  if(iDT<0) iDT=14;
  let maxIso='';
  for(let i=1;i<khNhomA.length;i++){
    const iso=normalizeNgayToIso(khNhomA[i][iNgay]);
    if(!/^\d{4}-\d{2}-\d{2}$/.test(iso)) continue;
    const mk=monthKeyFromIso(iso);
    if(mk&&thangEq(mk,thang)&&iso>maxIso) maxIso=iso;
  }
  if(!maxIso) return null;
  const dayCur=maxIso;
  const dayPrev=isoShiftDays(maxIso,-7);
  const dayPrev2=isoShiftDays(maxIso,-14);
  const needDays=new Set([dayCur,dayPrev,dayPrev2]);
  const monthCust=new Set();
  const byCust={};
  for(let i=1;i<khNhomA.length;i++){
    const r=khNhomA[i];
    const ma=(r[iMa]||'').trim();
    const iso=normalizeNgayToIso(r[iNgay]);
    if(!ma||!/^\d{4}-\d{2}-\d{2}$/.test(iso)) continue;
    const mk=monthKeyFromIso(iso);
    const inMonth=!!(mk&&thangEq(mk,thang));
    if(inMonth) monthCust.add(ma);
    if(!inMonth&&!needDays.has(iso)) continue;
    const dt=parseVNNum(r[iDT]);
    if(!byCust[ma]) byCust[ma]={ma,ten:(r[iTen]||'').trim(),am:(r[iAMk]||'').trim(),dates:{},dtMonth:0,lastIso:''};
    byCust[ma].ten=(r[iTen]||'').trim()||byCust[ma].ten;
    byCust[ma].am=(r[iAMk]||'').trim()||byCust[ma].am;
    if(iso>=byCust[ma].lastIso) byCust[ma].lastIso=iso;
    byCust[ma].dates[iso]=(byCust[ma].dates[iso]||0)+dt;
    if(inMonth) byCust[ma].dtMonth+=dt;
  }
  const weekCur=isoWeekFromIsoDate(dayCur).key;
  const weekPrev=isoWeekFromIsoDate(dayPrev).key;
  const rows=[...monthCust].map(ma=>{
    const c=byCust[ma]||{ma,ten:'',am:'',dates:{},dtMonth:0,lastIso:''};
    const dtCur=c.dates[dayCur]||0;
    const dtPrev=c.dates[dayPrev]||0;
    const dtPrev2=c.dates[dayPrev2]||0;
    const pctW=dtPrev>0?(dtCur-dtPrev)/dtPrev*100:(dtCur>0?100:0);
    const noRevWeek=dtCur===0&&dtPrev>0;
    const drop30=dtPrev>0&&dtCur>0&&pctW<=-30;
    const alert=noRevWeek||drop30;
    const giamHang=drop30||noRevWeek;
    const wasGiamPrev=dtPrev2>0&&((dtPrev===0)||(dtPrev>0&&((dtPrev-dtPrev2)/dtPrev2)<=-30));
    return {...c,dtMonth:c.dtMonth,dtCur,dtPrev,dtPrev2,pctW,noRevWeek,drop30,giamHang,alert,wasGiamPrev,lastIso:c.lastIso||dayCur,dayCur,dayPrev};
  });
  const coDonMonth=rows.filter(r=>r.dtMonth>0).length;
  const coDonWeekCur=rows.filter(r=>r.dtCur>0).length;
  const coDonWeekPrev=rows.filter(r=>r.dtPrev>0).length;
  const giamHang=rows.filter(r=>r.giamHang).length;
  const giamHangPrev=rows.filter(r=>r.wasGiamPrev).length;
  const nguyCo=rows.filter(r=>r.alert).length;
  const nguyCoPrev=rows.filter(r=>r.wasGiamPrev).length;
  const churnRows=rows.filter(r=>r.alert).sort((a,b)=>{
    if(a.noRevWeek!==b.noRevWeek) return a.noRevWeek?-1:1;
    return a.pctW-b.pctW;
  });
  return {
    weekCur,weekPrev,dayCur,dayPrev,weekday:weekdayVi(dayCur),
    weeks:[weekPrev,weekCur],total:rows.length,
    coDon:coDonMonth,coDonWeekCur,coDonWeekPrev,
    giamHang,giamHangPrev,nguyCo,nguyCoPrev,churnRows,
    wowCoDon:wowCountText(coDonWeekCur,coDonWeekPrev),
    wowGiamHang:wowCountText(giamHang,giamHangPrev),
    wowNguyCo:wowCountText(nguyCo,nguyCoPrev)
  };
}
function buildAmWeekDecline(dtNgay, thang, thresholdPct){
  const empty={weekCur:'',weekPrev:'',rows:[],all:[],daysUsed:0,spanDates:[],spanPrev:[]};
  if(!dtNgay||dtNgay.length<2) return empty;
  const h=dtNgay[0], iAM=idxOf(h,'AM Chuẩn'), iDT=idxOf(h,'DoanhThu'), iNgay=idxOf(h,'Ngay');
  const thangPrevM=thang?prevThang(thang):null;
  const byAMDate={};
  const weekKeys=[];
  for(let i=1;i<dtNgay.length;i++){
    const r=dtNgay[i];
    if(!r[iAM]||!r[iNgay]) continue;
    const iso=normalizeNgayToIso(r[iNgay]);
    if(!/^\d{4}-\d{2}-\d{2}$/.test(iso)) continue;
    if(thang){
      const mk=monthKeyFromIso(iso);
      if(!mk) continue;
      if(!thangEq(mk,thang) && !(thangPrevM && thangEq(mk,thangPrevM))) continue;
    }
    const wk=isoWeekFromIsoDate(iso).key;
    weekKeys.push(wk);
    if(!byAMDate[r[iAM]]) byAMDate[r[iAM]]={};
    byAMDate[r[iAM]][iso]=(byAMDate[r[iAM]][iso]||0)+parseVNNum(r[iDT]);
  }
  const weeks=sortedWeekKeys(weekKeys);
  const weekCur=weeks[weeks.length-1]||'';
  const weekPrev=weeks.length>=2?weeks[weeks.length-2]:'';
  if(!weekCur||!weekPrev) return {...empty,weekCur,weekPrev};

  // Cùng kỳ: T2 → ngày mới nhất tuần hiện tại, so với cùng các thứ ở tuần trước (−7 ngày)
  const datesInCur=[...new Set(Object.values(byAMDate).flatMap(m=>Object.keys(m)))]
    .filter(iso=>isoWeekFromIsoDate(iso).key===weekCur)
    .sort();
  if(!datesInCur.length) return {...empty,weekCur,weekPrev};
  const maxCur=datesInCur[datesInCur.length-1];
  const monCur=mondayOfIsoWeek(maxCur);
  const spanDates=isoEachDay(monCur, maxCur);
  const spanPrev=spanDates.map(d=>isoShiftDays(d,-7));
  const sumDays=(am, days)=>days.reduce((s,iso)=>s+((byAMDate[am]&&byAMDate[am][iso])||0),0);

  const thr=thresholdPct||20;
  const all=Object.keys(byAMDate).map(am=>{
    const cur=sumDays(am, spanDates);
    const prev=sumDays(am, spanPrev);
    const pctW=prev>0?(cur-prev)/prev*100:(cur>0?100:0);
    return {am,cur,prev,pctW,delta:cur-prev};
  });
  const rows=all.filter(r=>r.prev>0&&r.pctW<=-thr).sort((a,b)=>a.pctW-b.pctW);
  return {weekCur,weekPrev,rows,all,daysUsed:spanDates.length,spanDates,spanPrev};
}

function sumGtcByAM(sheet, thang){

  }
  return by;
}

function parseTotalKHMetrics(totalKH, thang){
  if(!totalKH||totalKH.length<2) return null;
  const h=totalKH[0];
  const iMa=idxOf(h,'MaKH'), iNhom=idxOf(h,'Nhom'), iVung=idxOf(h,'Vung');
  let iNgay=idxNgayChuanHoa(h);
  if(iNgay<0) iNgay=idxOf(h,'Ngay');
  const iDT=idxOf(h,'DT'), iTuan=idxOf(h,'Tuần'), iMtd=idxOf(h,'MTD');
  const iNV=idxOf(h,'Nhanvien');
  const byWeek={};
  const mtdByMa={};
  let maxNgay='';
  for(let i=1;i<totalKH.length;i++){
    const r=totalKH[i];
    if(iVung>=0 && !isVungTnt(r[iVung])) continue;
    const iso=parseVnNgay(r[iNgay]);
    const mk=monthKeyFromIso(iso);
    if(!mk||!thangEq(mk, thang)) continue;
    if(iso>maxNgay) maxNgay=iso;
    const wkIso=/^\d{4}-\d{2}-\d{2}$/.test(iso)?isoWeekFromIsoDate(iso).key:'';
    const wkSheet=String(r[iTuan]||'').trim();
    const wk=wkIso||wkSheet;
    const grp=normNhom(r[iNhom]);
    const dt=parseVNNum(r[iDT]);
    const ma=(r[iMa]||'').trim();
    if(wk){
      if(!byWeek[wk]) byWeek[wk]={dt:0,dtGiu:0,dtBanMoi:0,khG:new Set(),byGrp:{A:0,BCD:0,EF:0,G:0},byAm:{},byAmAll:{}};
      byWeek[wk].dt+=dt;
      if(grp) byWeek[wk].byGrp[grp]=(byWeek[wk].byGrp[grp]||0)+dt;
      if(NHOM_GIU_CU.includes(grp)) byWeek[wk].dtGiu+=dt;
      const nv=(iNV>=0?(r[iNV]||'').trim():'');
      if(nv) byWeek[wk].byAmAll[nv]=(byWeek[wk].byAmAll[nv]||0)+dt;
      if(grp==='G'){
        byWeek[wk].dtBanMoi+=dt;
        if(ma) byWeek[wk].khG.add(ma);
        if(nv) byWeek[wk].byAm[nv]=(byWeek[wk].byAm[nv]||0)+dt;
      }
    }
    if(ma){
      const mtd=parseMtdNum(r[iMtd]);
      if(!mtdByMa[ma]||iso>=mtdByMa[ma].maxNgay){
        mtdByMa[ma]={ma,grp,mtd,iso,maxNgay:iso};
      }
    }
  }
  const weeks=Object.keys(byWeek).map(w=>({w,sort:weekSortKeyIso(w)||(/^\d+$/.test(w)?+w:0)})).sort((a,b)=>a.sort-b.sort);
  const weekCur=weeks.length?weeks[weeks.length-1].w:'';
  const weekPrev=weeks.length>=2?weeks[weeks.length-2].w:'';
  let mtdGiu=0,mtdBanMoi=0;
  Object.values(mtdByMa).forEach(c=>{
    if(NHOM_GIU_CU.includes(c.grp)) mtdGiu+=c.mtd;
    if(c.grp==='G') mtdBanMoi+=c.mtd;
  });
  return {byWeek, weekCur, weekPrev, maxNgay, mtdGiu, mtdBanMoi};
}
/** Ma trận DT theo nhóm × tuần (ISO từ Ngày chuẩn hóa) — phục vụ xuất docs. */
function buildNhomWeekMatrix(totalKH, nWeeks){
  const empty={weeks:[], rows:[], byWeek:{}};
  const {recs}=parseTotalKHNhomRecs(totalKH);
  if(!recs.length) return empty;
  let weeks=sortedWeekKeys(recs.map(r=>r.tuan).filter(Boolean));
  const today=new Date();
  const todayIso=`${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}-${String(today.getDate()).padStart(2,'0')}`;
  const curKey=isoWeekFromIsoDate(todayIso).key;
  if(curKey && !weeks.includes(curKey)) weeks=[...weeks, curKey];
  weeks=sortedWeekKeys(weeks).slice(-(nWeeks||5));
  const byWeek={};
  weeks.forEach(w=>{ byWeek[w]={A:0,BCD:0,EF:0,G:0,total:0}; });
  recs.forEach(r=>{
    if(!byWeek[r.tuan]||!r.grp) return;
    byWeek[r.tuan][r.grp]=(byWeek[r.tuan][r.grp]||0)+r.dt;
    byWeek[r.tuan].total+=r.dt;
  });
  const prevOf=w=>{
    const i=weeks.indexOf(w);
    return i>0?weeks[i-1]:'';
  };
  const wow=(cur,prev)=>prev>0?(cur-prev)/prev*100:(cur>0?100:0);
  const mkRow=g=>{
    const vals=weeks.map(w=>{
      const cur=g==='total'?(byWeek[w].total||0):(byWeek[w][g]||0);
      const pw=prevOf(w);
      const prev=pw?(g==='total'?(byWeek[pw].total||0):(byWeek[pw][g]||0)):0;
      return {w, cur, pct:pw?wow(cur,prev):null};
    });
    return {g, vals};
  };
  const rows=[...NHOM_LABELS.map(mkRow), mkRow('total')];
  return {weeks, rows, byWeek};
}

function reconcileDtWithKetQua(recs, ketQua, thang){
  const p=parseThang(thang);

  const kqTotal=sumKetQuaMonth(ketQua, thang);
  if(!kqTotal) return recs;
  const dtTotal=recs.filter(r=>r.y===p.y&&r.m===p.m).reduce((s,r)=>s+r.dt,0);
  if(!dtTotal||dtTotal>=kqTotal*0.98) return recs;

}

    if(m>maxM) return null;

  const years=[2025,2026];
  let html=`<div class="card"><div class="card-header"><div class="card-title"><div class="card-icon">📦</div>Doanh Thu Hàng Nặng / Hàng Nhẹ Theo Tỉnh</div><span class="badge">2025: ${SHEET.dtThang2025} · 2026: ${SHEET.dtThang2026}</span></div>`;
  let lastYInsight='';
  years.forEach(y=>{
    const yrRecs=recs.filter(r=>r.y===y);
    if(!yrRecs.length) return;
    const now=new Date();
    const maxM = y===now.getFullYear() ? now.getMonth()+1 : 12;
    const months=[...new Set(yrRecs.map(r=>r.m))].filter(m=>m<=maxM).sort((a,b)=>a-b);
    const tinhs=[...new Set(yrRecs.map(r=>r.tinh))].sort();
    const mHdr=months.map(m=>`<th class="num" colspan="2">${String(m).padStart(2,'0')}/${y}</th>`).join('');
    const subHdr=months.map(()=>`<th class="num">Nặng</th><th class="num">Nhẹ</th>`).join('');
    html+=`<div class="am-title">Năm ${y}</div><div class="table-wrap"><table class="tbl-pro"><thead>
      <tr><th class="col-sticky" rowspan="2">Tỉnh</th>${mHdr}<th class="num" rowspan="2">Σ Nặng</th><th class="num" rowspan="2">Σ Nhẹ</th></tr>
      <tr>${subHdr}</tr></thead><tbody>`;
    tinhs.forEach(tinh=>{
      let tNang=0,tNhe=0;
      const cells=months.map(m=>{
        const nang=yrRecs.filter(r=>r.tinh===tinh&&r.m===m&&r.loai==='nang').reduce((s,r)=>s+r.dt,0);
        const nhe=yrRecs.filter(r=>r.tinh===tinh&&r.m===m&&r.loai==='nhe').reduce((s,r)=>s+r.dt,0);
        tNang+=nang; tNhe+=nhe;
        return `<td class="num">${fmtVndCell(nang)}</td><td class="num">${fmtVndCell(nhe)}</td>`;
      }).join('');
      html+=`<tr><td class="col-sticky"><span class="lbl-name">${tinh}</span></td>${cells}<td class="num">${fmtVndCell(tNang)}</td><td class="num">${fmtVndCell(tNhe)}</td></tr>`;
    });
    const totCells=months.map(m=>{
      const nang=yrRecs.filter(r=>r.m===m&&r.loai==='nang').reduce((s,r)=>s+r.dt,0);
      const nhe=yrRecs.filter(r=>r.m===m&&r.loai==='nhe').reduce((s,r)=>s+r.dt,0);
      return `<td class="num">${fmtVndCell(nang)}</td><td class="num">${fmtVndCell(nhe)}</td>`;
    }).join('');
    const gNang=yrRecs.filter(r=>r.loai==='nang').reduce((s,r)=>s+r.dt,0);
    const gNhe=yrRecs.filter(r=>r.loai==='nhe').reduce((s,r)=>s+r.dt,0);
    html+=`<tr class="tot"><td class="col-sticky">TỔNG ${y}</td>${totCells}<td class="num">${fmtVndCell(gNang)}</td><td class="num">${fmtVndCell(gNhe)}</td></tr>`;
    html+=`</tbody></table></div>`;
    const share=gNang+gNhe>0?(gNang/(gNang+gNhe)*100):0;
    lastYInsight=`Năm ${y}: Nặng <b>${fmtVnd(gNang)}</b> (${share.toFixed(0)}%) · Nhẹ <b>${fmtVnd(gNhe)}</b>.`;
  });
  if(lastYInsight) html+=analysisQuick(lastYInsight);
  html+=`</div>`;
  return html;
}
function parseVNNum(s){
  if(s==null) return 0;
  s = String(s).trim();
  if(!s) return 0;
  return parseFloat(s.replace(/\./g,'').replace(',','.')) || 0;
}
function parseCSV(text){
  const rows=[]; let row=[],field='',q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){field+='"';i++;} else q=false; } else field+=c; }
    else{
      if(c==='"') q=true;
      else if(c===','){row.push(field);field='';}
      else if(c==='\r'){}
      else if(c==='\n'){row.push(field);rows.push(row);row=[];field='';}
      else field+=c;
    }
  }
  if(field.length||row.length){row.push(field);rows.push(row);}
  return rows;
}
async function fetchGid(gid, retry=2){
  const url = `https://docs.google.com/spreadsheets/d/${SID}/gviz/tq?tqx=out:csv&gid=${gid}&_=${Date.now()}`;
  for(let i=0;i<=retry;i++){
    try{
      const r = await fetch(url, {cache:'no-store'});
      if(!r.ok) throw new Error('HTTP '+r.status);
      const t = await r.text();
      return parseCSV(t);
    }catch(e){
      if(i===retry) throw e;
      await new Promise(res=>setTimeout(res,1200*(i+1)));
    }
  }
}
async function fetchSheet(sheetName, retry=2){
  const url = `https://docs.google.com/spreadsheets/d/${SID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(sheetName)}&_=${Date.now()}`;
  for(let i=0;i<=retry;i++){
    try{
      const r = await fetch(url, {cache:'no-store'});
      if(!r.ok) throw new Error('HTTP '+r.status+' ('+sheetName+')');
      const t = await r.text();
      return parseCSV(t);
    }catch(e){
      if(i===retry) throw e;
      await new Promise(res=>setTimeout(res,1200*(i+1)));
    }
  }
}
function idxOf(header,name){ return header.map(h=>(h||'').trim()).indexOf(name); }
// Ngay dạng dd/mm/yyyy -> sortable yyyy-mm-dd
function ddmmyyyy2iso(s){
  s=(s||'').trim(); const m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  if(!m) return s;
  return `${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;
}
function parseVnNgay(s){
  s=(s||'').trim();
  const m=s.match(/^(\d{1,2})\s+thg\s+(\d{1,2}),\s*(\d{4})$/);
  if(m) return `${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;
  if(/^\d{4}-\d{2}-\d{2}/.test(s)) return s.slice(0,10);
  return ddmmyyyy2iso(s);
}
function normalizeNgayToIso(s){
  const iso=parseVnNgay(s);
  return /^\d{4}-\d{2}-\d{2}$/.test(iso)?iso:'';
}
function parseMtdNum(s){
  if(s==null) return 0;
  s=String(s).trim();
  if(!s||s==='-') return 0;
  if((s.match(/,/g)||[]).length>1) return parseFloat(s.replace(/,/g,''))||0;
  return parseVNNum(s);
}
function isVungTnt(vung){
  vung=(vung||'').trim().toUpperCase();
  return vung.startsWith('TNT')||vung.includes('VÙNG TNT');
}
function isoShort(iso){
  if(!iso) return '—';
  const m=iso.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if(!m) return iso;
  return `${m[3]}/${m[2]}`;
}
function currentThang(){
  const now=new Date();
  return `${now.getFullYear()}/${now.getMonth()+1}`;
}
function prevThang(thang){
  const p=parseThang(thang||currentThang());
  if(!p) return null;
  let m=p.m-1, y=p.y;
  if(m<1){ m=12; y--; }
  return `${y}/${m}`;
}
function monthDtFromDates(dates, thang){
  let t=0;
  Object.keys(dates).forEach(iso=>{
    const mk=monthKeyFromIso(iso);
    if(mk&&thangEq(mk,thang)) t+=dates[iso];
  });
  return t;
}
function monthVolFromVols(vols, thang){
  let t=0;
  Object.keys(vols).forEach(iso=>{
    const mk=monthKeyFromIso(iso);
    if(mk&&thangEq(mk,thang)) t+=vols[iso];
  });
  return t;
}
function lastNgayInMonth(dates, thang){
  return Object.keys(dates).filter(iso=>{
    const mk=monthKeyFromIso(iso);
    return mk&&thangEq(mk,thang)&&dates[iso]>0;
  }).sort().pop()||'';
}
function parseThang(s){
  s=(s||'').trim().replace(/\s+/g,'');
  const m=s.match(/^(\d{4})[\/\-](\d{1,2})$/);
  if(!m) return null;
  return { y:+m[1], m:+m[2] };
}
function monthKeyNorm(s){
  const p=parseThang(s);
  return p ? `${p.y}/${p.m}` : null;
}
function thangEq(a,b){
  const pa=parseThang(a), pb=parseThang(b);
  return pa && pb && pa.y===pb.y && pa.m===pb.m;
}
function uniqueMonthsSorted(monthKeys){
  const seen=new Map();
  monthKeys.filter(Boolean).forEach(t=>{
    const p=parseThang(t);
    if(!p) return;
    const sk=p.y*100+p.m;
    if(!seen.has(sk)) seen.set(sk, `${p.y}/${p.m}`);
  });
  return [...seen.values()].sort((a,b)=>monthSortKey(a)-monthSortKey(b));
}
function canonicalThangKey(y,m){
  return `${y}/${String(m).padStart(2,'0')}`;
}
function thangCellPreferred(rows, iThang, thang){
  const p=parseThang(thang);
  if(!p||iThang<0) return null;
  const canon=canonicalThangKey(p.y,p.m), short=`${p.y}/${p.m}`;
  let hasCanon=false, hasShort=false;
  rows.forEach(r=>{
    const t=(r[iThang]||'').trim();
    if(t===canon) hasCanon=true;
    if(t===short) hasShort=true;
  });
  if(hasCanon) return canon;
  if(hasShort) return short;
  return null;
}
function rowMatchesPreferredThang(cell, thang, preferred){
  // Luôn so theo y/m đã chuẩn hóa — cộng cả 2026/7 và 2026/07
  if(!cell) return true;
  return thangEq(cell.trim(), thang);
}
function sumKetQuaMonth(ketQua, thang){
  if(!ketQua||ketQua.length<2) return 0;
  const h=ketQua[0];
  const iAM=idxOf(h,'AM Chuẩn'), iDT=idxOf(h,'DoanhThu'), iThang=idxOf(h,'Thang');
  let total=0;
  for(let i=1;i<ketQua.length;i++){
    const r=ketQua[i];
    if(!r[iAM]) continue;
    if(iThang>=0&&r[iThang]&&!rowMatchesPreferredThang(r[iThang], thang, null)) continue;
    total+=parseVNNum(r[iDT]);
  }
  return total;
}
function formatThangLabel(s){
  const p=parseThang(s);
  return p ? `${p.y}/${String(p.m).padStart(2,'0')}` : s;
}
function monthKeyFromIso(iso){
  const m=(iso||'').match(/^(\d{4})-(\d{2})/);
  return m ? `${+m[1]}/${+m[2]}` : null;
}
function monthSortKey(s){
  const p=parseThang(s);
  return p ? p.y*100+p.m : 0;
}
function getLastNMonths(dateIsos,n=3){
  return uniqueMonthsSorted(dateIsos.map(monthKeyFromIso).filter(Boolean)).slice(-n);
}
function daysInMonth(y,m){ return new Date(y, m, 0).getDate(); }
function getLast7DaysInMonth(y, m, endDay){
  const dim=daysInMonth(y,m);
  const end=Math.min(Math.max(endDay||dim,1), dim);
  const start=Math.max(1, end-6);
  const out=[];
  for(let d=start; d<=end; d++){
    out.push(`${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`);
  }
  return out;
}
function nhomA7DayWindow(thang, dtNgay){
  const p=parseThang(thang);
  if(!p) return {days:[], label:'—'};
  const now=new Date();
  const prog=dtNgay?getMonthProgress(dtNgay):null;
  let endDay;
  if(p.y===now.getFullYear() && p.m===now.getMonth()+1){
    endDay=(prog&&prog.maxDataDay>0)?prog.maxDataDay:now.getDate();
  } else {
    endDay=daysInMonth(p.y,p.m);
  }
  const days=getLast7DaysInMonth(p.y,p.m,endDay);
  const label=days.length?`${isoShort2(days[0])} → ${isoShort2(days[days.length-1])}`:'—';
  return {days, label};
}
function sumDtOnDays(custDates, days){
  let s=0;
  days.forEach(d=>{ s+=custDates[d]||0; });
  return s;
}
function kpiSamePeriod(kpiFull, elapsed, totalDays){
  if(!kpiFull||!totalDays) return 0;
  return kpiFull * elapsed / totalDays;
}
function getMonthProgress(dtNgay){
  const parsed = parseThang(currentThang());
  const { y, m } = parsed;
  const totalDays = daysInMonth(y, m);
  const now = new Date();
  let maxDataDay = 0;
  if(dtNgay && dtNgay.length>1){
    const iNgay = idxOf(dtNgay[0],'Ngay');
    for(let i=1;i<dtNgay.length;i++){
      const iso = normalizeNgayToIso(dtNgay[i][iNgay]);
      const dm = iso.match(/^(\d{4})-(\d{2})-(\d{2})$/);
      if(dm && +dm[1]===y && +dm[2]===m) maxDataDay = Math.max(maxDataDay, +dm[3]);
    }
  }
  let elapsed;
  if(y===now.getFullYear() && m===now.getMonth()+1){
    elapsed = maxDataDay > 0 ? maxDataDay : now.getDate();
  } else {
    elapsed = maxDataDay > 0 ? maxDataDay : totalDays;
  }
  elapsed = Math.min(Math.max(elapsed, 1), totalDays);
  return { elapsed, totalDays, y, m, pctTime: elapsed/totalDays*100, maxDataDay };
}

/* ===================== 2) AM GIẢM DOANH THU — CÙNG KỲ TUẦN ===================== */
function renderDecline(){
  const el = document.getElementById('decline');
  const { dtNgay } = window._DATA;
  if(!dtNgay || dtNgay.length<2){ el.innerHTML = '<div class="data-banner err">Không có dữ liệu sheet DT-Ngày.</div>'; return; }
  const thang = currentThang();
  const thangLabel = formatThangLabel(thang);
  const { weekCur, weekPrev, rows, all, daysUsed, spanDates, spanPrev } = buildAmWeekDecline(dtNgay, thang, 20);

  if(!weekCur || !weekPrev){
    el.innerHTML = `
    <div class="page-header"><div><div class="page-title">AM Giảm Doanh Thu</div><div class="page-sub">So sánh cùng kỳ tuần hiện tại vs tuần trước · <span class="unit-note">triệu đồng</span></div></div></div>
    <div class="data-banner">📅 Chưa đủ 2 tuần dữ liệu trong tháng <b>${thangLabel}</b> (tính từ cột <b>Ngay</b>) để so sánh tuần.</div>
    <div class="foot-note">Nguồn: sheet "DT-Ngày" (gid=${GID.dtNgay}).</div>`;
    return;
  }

  const declined = rows;
  const improved = (all||[]).filter(r=>r.prev>0&&r.pctW>-20).sort((a,b)=>b.pctW-a.pctW);
  const spanLbl = spanDates&&spanDates.length
    ? `${isoShort2(spanDates[0])}–${isoShort2(spanDates[spanDates.length-1])}`
    : `${daysUsed||'?'} ngày`;
  const prevLbl = spanPrev&&spanPrev.length
    ? `${isoShort2(spanPrev[0])}–${isoShort2(spanPrev[spanPrev.length-1])}`
    : 'cùng kỳ';
  const hdrPrev = `${weekLabelShort(weekPrev)} CK`;
  const hdrCur = `${weekLabelShort(weekCur)}`;

  let body = `<div class="card"><div class="card-header"><div class="card-title"><div class="card-icon" style="background:var(--red)">⚠️</div>AM Giảm &gt;20% So Với Cùng Kỳ Tuần Trước</div><span class="badge">${weekLabelShort(weekPrev)} → ${weekLabelShort(weekCur)} · ${daysUsed} ngày</span></div>`;
  if(!declined.length){
    body += `<div class="section-note">✅ Không có AM nào giảm doanh thu &gt;20% so với cùng kỳ tuần trước (${daysUsed} ngày).</div>`;
    body += analysisQuick(`So sánh <b>${daysUsed} ngày</b> cùng kỳ (${spanLbl} vs ${prevLbl}). Không có AM giảm &gt;20%.`);
  } else {
    body += `<div class="table-wrap"><table class="tbl-pro"><thead><tr><th style="width:48px">#</th><th>AM</th><th class="num">${hdrPrev}</th><th class="num">${hdrCur}</th><th class="num">Chênh lệch</th><th class="num">%</th></tr></thead><tbody>`;
    declined.forEach((r,i)=>{
      body += `<tr class="row-warn"><td><span class="rank-num">${i+1}</span></td><td><span class="lbl-name">${r.am}</span></td><td class="num">${fmtVndCell(r.prev)}</td><td class="num">${fmtVndCell(r.cur)}</td>
        <td class="num"><span class="trend-tag down">▼ ${fmtM(Math.abs(r.delta))} tr</span></td><td class="num"><span class="trend-tag down">${r.pctW.toFixed(0)}%</span></td></tr>`;
    });
    body += `</tbody></table></div>`;
    body += analysisQuick(`<b>${declined.length}</b> AM giảm &gt;20% · cùng kỳ <b>${daysUsed} ngày</b> (${spanLbl} vs ${prevLbl}). Giảm mạnh nhất: <b>${declined[0].am}</b> (${declined[0].pctW.toFixed(0)}%).`);
  }
  body += `</div>`;

  body += `<div class="card"><div class="card-header"><div class="card-title"><div class="card-icon" style="background:var(--green)">✅</div>AM Tăng / Ổn Định (cùng kỳ)</div><span class="badge">${daysUsed} ngày</span></div>
  <div class="table-wrap"><table class="tbl-pro"><thead><tr><th style="width:48px">#</th><th>AM</th><th class="num">${hdrPrev}</th><th class="num">${hdrCur}</th><th class="num">%</th></tr></thead><tbody>`;
  improved.forEach((r,i)=>{
    body += `<tr><td><span class="rank-num">${i+1}</span></td><td><span class="lbl-name">${r.am}</span></td><td class="num">${fmtVndCell(r.prev)}</td><td class="num">${fmtVndCell(r.cur)}</td><td class="num"><span class="trend-tag ${r.pctW<0?'up':'down'}">${r.pctW.toFixed(0)}%</span></td></tr>`;
  });
  body += `</tbody></table></div>`;
  const bestUp = improved.filter(r=>r.pctW>0)[0];
  body += analysisQuick(bestUp
    ? `<b>${improved.length}</b> AM tăng/ổn định (≥ −20%). Dẫn đầu tăng: <b>${bestUp.am}</b> (+${bestUp.pctW.toFixed(0)}%).`
    : `<b>${improved.length}</b> AM không giảm quá 20% trên cùng kỳ ${daysUsed} ngày.`);
  body += `</div>`;

  el.innerHTML = `
  <div class="page-header"><div><div class="page-title">AM Giảm Doanh Thu</div><div class="page-sub">Cùng kỳ tuần hiện tại vs tuần trước · không so tổng tuần thiếu ngày · <span class="unit-note">triệu đồng</span></div></div></div>
  <div class="data-banner">📅 Tháng <b>${thangLabel}</b> · So sánh cùng kỳ <b>${daysUsed} ngày</b>: <b>${spanLbl}</b> (${weekLabelShort(weekCur)}) vs <b>${prevLbl}</b> (${weekLabelShort(weekPrev)}).</div>
  ${body}
  <div class="foot-note">Nguồn: sheet "DT-Ngày" (gid=${GID.dtNgay}). Ngưỡng cảnh báo: giảm &gt;20% so với cùng kỳ tuần liền trước (T2 → ngày mới nhất tuần hiện tại).</div>`;
}

function renderSegment(){
  const el = document.getElementById('segment');
  const { totalKH } = window._DATA;
  if(!totalKH || totalKH.length<2){ el.innerHTML = `<div class="data-banner err">Không có dữ liệu sheet ${SHEET.totalKH}.</div>`; return; }
  const { recs, maxDate } = parseTotalKHNhomRecs(totalKH);

  const allDates = [...new Set(recs.map(r=>r.ngay))].sort();
  const last3 = allDates.slice(-3);
  const set3 = new Set(last3);
  const ams = [...new Set(recs.filter(r=>r.am&&set3.has(r.ngay)).map(r=>r.am))].sort();
  const dayHdr = last3.map(d=>`<th class="num">${isoShort2(d)}</th>`).join('');

  let body = '';
  let regionTot = 0;
  const amTotals = [];
  ams.forEach((am,ai)=>{
    const amRecs = recs.filter(r=>r.am===am&&set3.has(r.ngay));
    body += `<div class="card am-block"><div class="am-title">${ai+1}. ${am}</div>
    <div class="table-wrap"><table class="tbl-pro"><thead><tr>
      <th>Nhóm</th>${dayHdr}<th class="num">Tổng 3N</th>
    </tr></thead><tbody>`;
    let totByDay = {}; last3.forEach(d=>{ totByDay[d]=0; });
    let totAll = 0;
    NHOM_LABELS.forEach(g=>{
      let rowTot = 0;
      const cells = last3.map(d=>{
        const v = amRecs.filter(r=>r.grp===g&&r.ngay===d).reduce((s,r)=>s+r.dt,0);
        totByDay[d]+=v; rowTot+=v;
        return `<td class="num">${fmtVndCell(v)}</td>`;
      }).join('');
      totAll+=rowTot;
      body += `<tr><td>${nhomTag(g)}</td>${cells}<td class="num">${fmtVndCell(rowTot)}</td></tr>`;
    });
    const totCells = last3.map(d=>`<td class="num">${fmtVndCell(totByDay[d])}</td>`).join('');
    body += `<tr class="tot"><td>Tổng</td>${totCells}<td class="num">${fmtVndCell(totAll)}</td></tr>`;
    body += `</tbody></table></div>`;
    body += analysisQuick(`AM <b>${am}</b>: tổng 3N <b>${fmtVnd(totAll)}</b>.`);
    body += `</div>`;
    regionTot += totAll;
    amTotals.push({am, tot: totAll});
  });
  const topAm = amTotals.slice().sort((a,b)=>b.tot-a.tot)[0];

  el.innerHTML = `
  <div class="page-header"><div><div class="page-title">Phân Nhóm Khách Hàng</div><div class="page-sub">Theo AM · 3 ngày gần nhất · <span class="unit-note">triệu đồng</span></div></div><span class="badge">Mới nhất: ${isoShort2(maxDate)}</span></div>
  ${nhomStaleBanner(maxDate, SHEET.totalKH)}
  <div class="data-banner" style="margin-top:0">📊 3 ngày gần nhất (cột <b>Ngày chuẩn hóa</b>): <b>${last3.map(isoShort2).join(' · ')||'—'}</b></div>
  ${body||'<div class="data-banner">Không có dữ liệu 3 ngày gần nhất.</div>'}
  ${topAm?analysisQuick(`Toàn vùng 3N: <b>${fmtVnd(regionTot)}</b> · AM dẫn đầu: <b>${topAm.am}</b> (${fmtVnd(topAm.tot)}).`):''}
  <div class="foot-note">Nguồn: sheet "${SHEET.totalKH}" · cột Ngày chuẩn hóa (vd. 12/07/2026).</div>`;
}

/* ===================== 4) NHÓM A — PHÂN TÍCH KHÁCH HÀNG ===================== */
function renderNhomA(){
  const el = document.getElementById('nhomA');
  const { khNhomA } = window._DATA;
  if(!khNhomA || khNhomA.length<2){
    el.innerHTML = '<div class="data-banner err">Không có dữ liệu sheet khách hàng nhóm A.</div>';
    return;
  }
  const h = khNhomA[0];
  const iMa = idxOf(h,'MaKH'), iTen = idxOf(h,'TenKH'), iNgay = idxOf(h,'Ngay'), iVol = idxOf(h,'Volume');
  const iAM = idxAMCol(h) >= 0 ? idxAMCol(h) : 22;
  let iDT = idxOfNth(h,'% Doanh thu đạt được so với MTD',3);
  if(iDT<0) iDT = 14;

  const thangCur = currentThang();
  const thangPrev = prevThang(thangCur);
  const thangCurLabel = formatThangLabel(thangCur);
  const thangPrevLabel = formatThangLabel(thangPrev);

  const byCust = {};
  for(let i=1;i<khNhomA.length;i++){
    const r = khNhomA[i];
    const ma = (r[iMa]||'').trim(), ten = (r[iTen]||'').trim(), am = (r[iAM]||'').trim();
    const ngayIso = normalizeNgayToIso(r[iNgay]);
    if(!ma || !ngayIso) continue;
    const dt = parseVNNum(r[iDT]);
    const vol = iVol>=0 ? Math.round(parseVNNum(r[iVol])) : 0;
    if(!byCust[ma]) byCust[ma] = {ma, ten, am, dates:{}, vols:{}};
    byCust[ma].ten = ten || byCust[ma].ten;
    byCust[ma].am = am || byCust[ma].am;
    byCust[ma].dates[ngayIso] = (byCust[ma].dates[ngayIso]||0) + dt;
    byCust[ma].vols[ngayIso] = (byCust[ma].vols[ngayIso]||0) + vol;
  }

  const rows = Object.values(byCust).map(c=>{
    const dtCur = monthDtFromDates(c.dates, thangCur);
    const dtPrev = monthDtFromDates(c.dates, thangPrev);
    const volCur = monthVolFromVols(c.vols, thangCur);
    const volPrev = monthVolFromVols(c.vols, thangPrev);
    const lastCur = lastNgayInMonth(c.dates, thangCur);
    const lastPrev = lastNgayInMonth(c.dates, thangPrev);
    return {...c, dtCur, dtPrev, volCur, volPrev, lastCur, lastPrev};
  });

  const activeCur = rows.filter(r=>r.dtCur>0).sort((a,b)=>b.dtCur-a.dtCur);
  const churnRows = rows.filter(r=>r.dtPrev>0 && r.dtCur===0).sort((a,b)=>b.dtPrev-a.dtPrev);
  const totalDtCur = activeCur.reduce((s,r)=>s+r.dtCur,0);

  const kpiCards = `
  <div class="kpi-grid">
    <div class="kpi-card">
      <div class="ic" style="background:var(--green-bg);color:var(--green)">✅</div>
      <div class="lbl">KH có doanh thu tháng ${thangCurLabel}</div>
      <div class="val"><span class="hero-amt">${fmt(activeCur.length)}</span><span class="hero-unit">KH</span></div>
      <div class="sub">Tính theo cột Ngay → tháng hiện tại</div>
    </div>
    <div class="kpi-card">
      <div class="ic" style="background:var(--blue-light);color:var(--blue-dark)">💰</div>
      <div class="lbl">Tổng DT tháng ${thangCurLabel}</div>

function isoShort2(iso){
  if(!iso) return '—';
  const m = iso.match(/^(\d{4})-(\d{2})-(\d{2})/);
  return m? `${m[3]}/${m[2]}/${m[1]}` : iso;
}

function docEsc(s){
  return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function pctWoWText(cur, prev){
  if(!prev && !cur) return '—';
  if(!prev) return 'Mới';
  const d=(cur-prev)/prev*100;
  return (d>=0?'+':'')+d.toFixed(1)+'%';
}
function weekLabelShort(w){
  if(!w) return '—';
  const p=(w||'').split('/');
  if(p.length>=2) return 'T'+p[1]+'/'+p[0];
  if(/^\d+$/.test(String(w).trim())) return 'Tuần '+w;
  return w;
}

function sumPnSlkh(recs, pred){ return recs.filter(pred).reduce((s,r)=>s+r.slkh,0); }
function sumPnVol(recs, pred){ return recs.filter(pred).reduce((s,r)=>s+r.vol,0); }

function buildWeeklyReportData(){
  const { ketQua, kpiAM, dtNgay, phanNhom, khNhomA, dtThang, dtThang2025, dtGtc, totalKH } = window._DATA;
  const thang = currentThang();
  const thangPrevM = prevThang(thang);
  const thangLabel = formatThangLabel(thang);
  const thangPrevLabel = formatThangLabel(thangPrevM);
  const dtThangRecs = reconcileDtWithKetQua(mergeDtThangRecs(dtThang2025, dtThang), ketQua, thang);
  const { recs: pnRecs, maxDate: pnMaxDateInit } = parsePhanNhomRecs(phanNhom);
  let pnMaxDate = pnMaxDateInit;
  const { elapsed, totalDays } = getMonthProgress(dtNgay);

  const mtdKetQua = sumKetQuaMonth(ketQua, thang);
  const mtdLtcThang = dtThangRecs.filter(r=>thangEq(`${r.y}/${r.m}`, thang)).reduce((s,r)=>s+r.dt,0);
  const mtdLtc = mtdLtcThang || mtdKetQua;
  const mtdGtc = sumSheetDtMonth(dtGtc, thang);
  const prevLtc = thangPrevM ? sumKetQuaMonth(ketQua, thangPrevM) : 0;
  const prevGtc = thangPrevM ? sumSheetDtMonth(dtGtc, thangPrevM) : 0;

  const hKPI = kpiAM[0];
  const iAMk = idxOf(hKPI,'AM'), iKPIVung = idxOf(hKPI,'KPI Vùng'), iThangKPI = idxOf(hKPI,'Tháng');
  let iKPICm = idxOf(hKPI,'KPI CM');
  if(iKPICm<0) iKPICm = idxOf(hKPI,'KPI Cty');
  let targetThang = 0, totalKpiCm = 0;
  const targetByAM={}, kpiCmByAM={};
  for(let i=1;i<kpiAM.length;i++){
    const r = kpiAM[i]; if(!r[iAMk]) continue;
    if(iThangKPI>=0 && r[iThangKPI] && !rowMatchesPreferredThang(r[iThangKPI], thang, null)) continue;
    const am=r[iAMk], v=parseVNNum(r[iKPIVung]), cm=iKPICm>=0?parseVNNum(r[iKPICm]):0;
    if(!(am in targetByAM) || v>targetByAM[am]){
      if(am in targetByAM) targetThang-=targetByAM[am];
      targetByAM[am]=v;
      targetThang+=v;
    }
    if(cm && (!(am in kpiCmByAM) || cm>kpiCmByAM[am])){
      if(am in kpiCmByAM) totalKpiCm-=kpiCmByAM[am];
      kpiCmByAM[am]=cm;
      totalKpiCm+=cm;
    }
  }
  const kpiCungKy = kpiSamePeriod(targetThang, elapsed, totalDays);
  const pctHoanThanh = pct(mtdLtc, targetThang);
  const pctCungKy = pct(mtdLtc, kpiCungKy);

  // Target giữ cũ = DT tháng trước (Kết Quả ≈ 11.2 tỷ). Target bán mới = KPI Vùng − giữ cũ.
  const targetGiuCu = prevLtc || 0;
  const targetBanMoi = Math.max(0, targetThang - targetGiuCu);
  const targetBanMoiCm = Math.max(0, totalKpiCm - targetGiuCu);

  const monthPn = pnRecs.filter(r=>r.thang&&thangEq(r.thang, thang));
  const tkMetrics = parseTotalKHMetrics(totalKH, thang);
  let weekCur='', weekPrev='', mtdGiu=0, mtdBanMoi=0;
  let wowLtc='—', wowGiu='—', wowBanMoi='—', slkhG=0, volG=0;
  if(tkMetrics && tkMetrics.weekCur){
    weekCur=tkMetrics.weekCur;
    weekPrev=tkMetrics.weekPrev;
    const wCur=tkMetrics.byWeek[weekCur]||{};
    const wPrev=tkMetrics.byWeek[weekPrev]||{};
    wowLtc=pctWoWText(wCur.dt||0, wPrev.dt||0);
    wowGiu=pctWoWText(wCur.dtGiu||0, wPrev.dtGiu||0);
    wowBanMoi=pctWoWText(wCur.dtBanMoi||0, wPrev.dtBanMoi||0);
    slkhG=wCur.khG?wCur.khG.size:0;
  }
  if(tkMetrics){
    mtdGiu=tkMetrics.mtdGiu||0;
    mtdBanMoi=tkMetrics.mtdBanMoi||0;
    if(tkMetrics.maxNgay && (!pnMaxDate || tkMetrics.maxNgay>pnMaxDate)) pnMaxDate=tkMetrics.maxNgay;
  }
  if(!weekCur){
    const weeks=[...new Set(monthPn.map(r=>r.tuan).filter(Boolean))].sort((a,b)=>weekSortKey(a)-weekSortKey(b));
    weekCur=weeks[weeks.length-1]||'';
    weekPrev=weeks.length>=2?weeks[weeks.length-2]:'';
    const matchWk=(r,w)=>r.tuan===w;
    const dtWeekAll=w=>sumPnDt(monthPn,r=>matchWk(r,w));
    const dtWeekGiu=w=>sumPnDt(monthPn,r=>matchWk(r,w)&&NHOM_GIU_CU.includes(r.grp));
    const dtWeekBanMoi=w=>sumPnDt(monthPn,r=>matchWk(r,w)&&r.grp==='G');
    wowLtc=pctWoWText(dtWeekAll(weekCur), dtWeekAll(weekPrev));
    wowGiu=pctWoWText(dtWeekGiu(weekCur), dtWeekGiu(weekPrev));
    wowBanMoi=pctWoWText(dtWeekBanMoi(weekCur), dtWeekBanMoi(weekPrev));
    slkhG=sumPnSlkh(monthPn,r=>r.tuan===weekCur&&r.grp==='G');
    volG=sumPnVol(monthPn,r=>r.tuan===weekCur&&r.grp==='G');
    if(!mtdGiu) mtdGiu=sumPnDt(monthPn,r=>NHOM_GIU_CU.includes(r.grp));
    if(!mtdBanMoi) mtdBanMoi=sumPnDt(monthPn,r=>r.grp==='G');
  } else if(!volG){
    volG=sumPnVol(monthPn,r=>r.tuan===weekCur&&r.grp==='G');
  }
  // Prev-month giữ cũ / bán mới từ TotalKH (cộng DT cả tháng)
  let prevGiu=0, prevBanMoi=0;
  if(totalKH&&totalKH.length>2&&thangPrevM){
    const prevRecs=parseTotalKHNhomRecs(totalKH).recs.filter(r=>r.thang&&thangEq(r.thang,thangPrevM));
    prevGiu=prevRecs.filter(r=>NHOM_GIU_CU.includes(r.grp)).reduce((s,r)=>s+r.dt,0);
    prevBanMoi=prevRecs.filter(r=>r.grp==='G').reduce((s,r)=>s+r.dt,0);
  }

  const projLtc=projectMonth(mtdLtc,elapsed,totalDays);
  const projGtc=projectMonth(mtdGtc,elapsed,totalDays);
  const projGiu=projectMonth(mtdGiu,elapsed,totalDays);
  const projBanMoi=projectMonth(mtdBanMoi,elapsed,totalDays);

  const planRows=[
    {
      label:'Tổng doanh thu LTC',
      mtd:mtdLtc, target:targetThang,
      pctMtd:pct(mtdLtc,targetThang),
      projected:projLtc, pctProj:pct(projLtc,targetThang),
      mom:fmtMomPct(projLtc, prevLtc)
    },
    {
      label:'Tổng doanh thu GTC',
      mtd:mtdGtc, target:targetThang,
      pctMtd:pct(mtdGtc,targetThang),
      projected:projGtc, pctProj:pct(projGtc,targetThang),
      mom:fmtMomPct(projGtc, prevGtc)
    },
    {
      label:'Doanh thu giữ cũ (A/BCD/EF)',
      mtd:mtdGiu, target:targetGiuCu,
      pctMtd:pct(mtdGiu,targetGiuCu),
      projected:projGiu, pctProj:pct(projGiu,targetGiuCu),
      mom:fmtMomPct(projGiu, prevGiu||prevLtc)
    },
    {
      label:'Doanh thu bán mới (Nhóm G)',
      mtd:mtdBanMoi, target:targetBanMoi,
      pctMtd:pct(mtdBanMoi,targetBanMoi),
      projected:projBanMoi, pctProj:pct(projBanMoi,targetBanMoi),
      mom:fmtMomPct(projBanMoi, prevBanMoi)
    }
  ];
  const nhomWeekMatrix=buildNhomWeekMatrix(totalKH, 5);

  const slkhAvgG=slkhG?Math.round(volG/slkhG):0;
  const matchWk=(r,w)=>r.tuan===w||(tkMetrics&&String(r.tuan)===String(w));

  let topAmBanMoi=[], topAmGiam=[], nhomWeekGiu=[];
  if(tkMetrics&&tkMetrics.weekCur){
    const wCur=tkMetrics.byWeek[tkMetrics.weekCur]||{};
    const wPrev=tkMetrics.byWeek[tkMetrics.weekPrev]||{};
    topAmBanMoi=Object.entries(wCur.byAm||{}).sort((a,b)=>b[1]-a[1]).slice(0,5);
    nhomWeekGiu=NHOM_GIU_CU.map(g=>({g, cur:(wCur.byGrp||{})[g]||0, prev:(wPrev.byGrp||{})[g]||0}));
    const amGiamTk={};
    Object.keys({...(wCur.byAmAll||{}),...(wPrev.byAmAll||{})}).forEach(nv=>{
      const c=(wCur.byAmAll||{})[nv]||0, p=(wPrev.byAmAll||{})[nv]||0;
      if(p&&c<p) amGiamTk[nv]=((c-p)/p*100);
    });
    topAmGiam=Object.entries(amGiamTk).sort((a,b)=>a[1]-b[1]).slice(0,5);
  }
  if(!topAmBanMoi.length){
    const amBanMoi={};
    monthPn.filter(r=>r.grp==='G'&&matchWk(r,weekCur)).forEach(r=>{ amBanMoi[r.am]=(amBanMoi[r.am]||0)+r.dt; });
    topAmBanMoi=Object.entries(amBanMoi).sort((a,b)=>b[1]-a[1]).slice(0,5);
  }
  if(!topAmGiam.length){
    const amGiam={};
    if(weekCur&&weekPrev){
      const ams=[...new Set(monthPn.map(r=>r.am).filter(Boolean))];
      ams.forEach(am=>{
        const c=sumPnDt(monthPn,r=>r.am===am&&matchWk(r,weekCur));
        const p=sumPnDt(monthPn,r=>r.am===am&&matchWk(r,weekPrev));
        if(p&&c<p) amGiam[am]=((c-p)/p*100);
      });
    }
    topAmGiam=Object.entries(amGiam).sort((a,b)=>a[1]-b[1]).slice(0,5);
  }
  if(!nhomWeekGiu.length){
    nhomWeekGiu=NHOM_GIU_CU.map(g=>({ g, cur:sumPnDt(monthPn,r=>matchWk(r,weekCur)&&r.grp===g), prev:sumPnDt(monthPn,r=>matchWk(r,weekPrev)&&r.grp===g) }));
  }

  let nhomA = { total:0, coDon:0, giamHang:0, nguyCo:0, churnRows:[], weekCur:'', weekPrev:'', wowCoDon:'—', wowGiamHang:'—', wowNguyCo:'—' };
  const nhomAWeekly = parseKhNhomAWeekly(khNhomA, thang);
  if(nhomAWeekly){
    nhomA = {
      total: nhomAWeekly.total,
      coDon: nhomAWeekly.coDon,
      giamHang: nhomAWeekly.giamHang,
      nguyCo: nhomAWeekly.nguyCo,
      churnRows: nhomAWeekly.churnRows,
      weekCur: nhomAWeekly.weekCur,
      weekPrev: nhomAWeekly.weekPrev,
      dayCur: nhomAWeekly.dayCur,
      dayPrev: nhomAWeekly.dayPrev,
      weekday: nhomAWeekly.weekday,
      wowCoDon: nhomAWeekly.wowCoDon,
      wowGiamHang: nhomAWeekly.wowGiamHang,
      wowNguyCo: nhomAWeekly.wowNguyCo
    };
    if(nhomAWeekly.weekCur && !weekCur) weekCur = nhomAWeekly.weekCur;
    if(nhomAWeekly.weekPrev && !weekPrev) weekPrev = nhomAWeekly.weekPrev;
  }

  const dtByDate = buildDtNgayByDate(dtNgay, thang);
  const weekBreakdown = buildMonthWeekBreakdown(dtByDate, thang, targetThang, totalDays);

  const tiemNang = countKhTiemNangFromTotalKH(totalKH, thang, elapsed, totalDays);
  const amWeekDecline = buildAmWeekDecline(dtNgay, thang, 20);
  const base = {
    vung:VUNG_NAME, thangLabel, thangPrevLabel, weekCur, weekPrev,
    weekLabel: weekCur ? weekLabelShort(weekCur) : '—',
    nhomAWeekLabel: nhomA.weekCur ? weekLabelShort(nhomA.weekCur) : (weekCur ? weekLabelShort(weekCur) : '—'),
    dateStr: new Date().toISOString().slice(0,10),
    pnMaxDate, elapsed, totalDays,
    mtdLtc, mtdGtc, targetThang, totalKpiCm, kpiCungKy, pctHoanThanh, pctCungKy,
    pctHoanThanhGtc: pct(mtdGtc, targetThang),
    wowLtc, wowGtc: prevGtc?fmtMomPct(projGtc, prevGtc):'—',
    mtdGiu, mtdBanMoi, wowGiu, wowBanMoi,
    targetGiuCu, targetBanMoi, targetBanMoiCm, prevLtc, prevGtc, prevGiu, prevBanMoi,
    projLtc, projGtc, projGiu, projBanMoi, planRows, nhomWeekMatrix,
    slkhG, volG, slkhAvgG, topAmBanMoi, topAmGiam, nhomWeekGiu, nhomA, tiemNang, weekBreakdown, amWeekDecline
  };
  base.narratives = buildWeeklyReportNarratives(base);
  return base;
}

function docNhomWeekTable(matrix){
  if(!matrix||!matrix.weeks||!matrix.weeks.length) return '<p><i>Chưa có dữ liệu tuần theo nhóm (TotalKH).</i></p>';
  const weeks=matrix.weeks.slice().reverse(); // mới → cũ như ảnh
  const trHdr=`<tr><th rowspan="2">Nhóm KH</th><th colspan="${weeks.length}">Tuần (tr)</th><th colspan="${weeks.length}">Tuần (% WoW)</th></tr>
    <tr>${weeks.map(w=>`<th>${docEsc(String(w).includes('/')?w.split('/').pop():w)}</th>`).join('')}${weeks.map(w=>`<th>${docEsc(String(w).includes('/')?w.split('/').pop():w)}</th>`).join('')}</tr>`;
  const body=matrix.rows.map(row=>{
    const byW={};
    row.vals.forEach(v=>{ byW[v.w]=v; });
    const dtCells=weeks.map(w=>{
      const v=byW[w];
      const n=v?v.cur:0;
      return `<td align="right">${n?docEsc(fmtVnd(n)):'—'}</td>`;
    }).join('');
    const pctCells=weeks.map(w=>{
      const v=byW[w];
      if(!v||v.pct==null) return `<td align="right">—</td>`;
      return `<td align="right">${docEsc((v.pct>=0?'+':'')+v.pct.toFixed(0)+'%')}</td>`;
    }).join('');
    const gLabel=row.g==='total'?'Tổng':row.g;
    return `<tr><td>${docEsc(gLabel)}</td>${dtCells}${pctCells}</tr>`;
  }).join('');
  return `<table class="doc"><thead>${trHdr}</thead><tbody>${body}</tbody></table>`;
}
function docRowNhomA(label, data, wow, note){
  return `<tr><td>${docEsc(label)}</td><td align="center">${docEsc(data)}</td><td align="center">${docEsc(wow)}</td><td>${docEsc(note||'')}</td></tr>`;
}
function docPadRows(htmlRows, cols, minRows){
  let out=htmlRows;
  const n=(htmlRows.match(/<tr/g)||[]).length;
  for(let i=n;i<minRows;i++) out+=`<tr>${'<td>&nbsp;</td>'.repeat(cols)}</tr>`;
  return out;
}

function exportWeeklyReportDoc(){
  if(!loaded||!window._DATA.ketQua){
    alert('Vui lòng bấm "Cập nhật dữ liệu" trước khi xuất báo cáo.');
    return;
  }
  const btn=document.getElementById('exportDocBtn');
  btn.disabled=true;
  try{
    const d=buildWeeklyReportData();
    const html=renderWeeklyReportDocHtml(d);
    const blob=new Blob(['\ufeff', html], {type:'application/msword;charset=utf-8'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    const safeWeek=(d.weekCur||'tuan').replace(/\//g,'-');
    a.href=url;
    a.download=`BaoCao-KD-${d.vung.replace(/\s+/g,'')}-${safeWeek}-${d.dateStr}.doc`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 2000);
  }catch(e){
    alert('Lỗi xuất báo cáo: '+e.message);
  }
  btn.disabled=false;
}

/* ===================== INIT ===================== */
loadAll();
</script>
